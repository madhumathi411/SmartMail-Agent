<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartMail Inbox</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="navbar">

    <h2>📧 SmartMail Agent</h2>

    <a href="/dashboard">Dashboard</a>

</div>

<div class="dashboard">

    <h1>📥 Email Inbox</h1>

    <div class="welcome">

        <h2>Emails waiting for AI analysis</h2>

        <p>
            SmartMail Agent will analyze incoming emails,
            detect their intent, assign priority,
            and generate suitable responses.
        </p>

    </div>

    <div class="card">

        <h3>🔴 Payment Issue</h3>

        <p>
            I was charged twice for my recent order.
            Please help me resolve this issue.
        </p>

        <button>
            Analyze Email
        </button>

    </div>

</div>

</body>
</html>
